[package]
name = "nextnote"
version = "0.1.0"
edition = "2021"
description = "A predictive-coding sequence learner that learns melodies online, in Rust and WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
